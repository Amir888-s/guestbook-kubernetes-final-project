<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guestbook - v1</title>
  <style>
    body{font-family:Arial,sans-serif;max-width:720px;margin:60px auto;padding:0 20px;background:#f4f7fb;color:#172b4d}
    main{background:#fff;padding:32px;border-radius:12px;box-shadow:0 8px 28px rgba(9,30,66,.12)}
    input,button{font:inherit;padding:12px;border-radius:6px}input{width:65%;border:1px solid #9aa5b1}button{background:#0f62fe;color:#fff;border:0}
  </style>
</head>
<body>
  <main>
    <h1>Guestbook - v1</h1>
    <p>Enter a message for the Guestbook.</p>
    <input aria-label="Message" placeholder="Write a message">
    <button type="button">Submit</button>
  </main>
</body>
</html>
